<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recetarios de Aquí — Recetario Puertorriqueño</title>
  <meta name="description" content="Recetario digital inspirado en Recetarios de Aquí de Berta Cabanillas. Recetas tradicionales puertorriqueñas.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="lang-toggle">
      <button class="lang-btn active" id="btn-es">ES</button>
      <button class="lang-btn" id="btn-en">EN</button>
    </div>
    <!-- Bandera de Puerto Rico SVG -->
    <div class="banner-flag" aria-label="Bandera de Puerto Rico">
      <svg viewBox="0 0 900 600" width="120" height="80" class="pr-flag-svg">
        <!-- 5 franjas: roja, blanca, roja, blanca, roja -->
        <rect width="900" height="120" y="0" fill="#ED0000"/>
        <rect width="900" height="120" y="120" fill="#FFFFFF"/>
        <rect width="900" height="120" y="240" fill="#ED0000"/>
        <rect width="900" height="120" y="360" fill="#FFFFFF"/>
        <rect width="900" height="120" y="480" fill="#ED0000"/>
        <!-- Triángulo azul -->
        <polygon points="0,0 470,300 0,600" fill="#0050F0"/>
        <!-- Estrella blanca -->
        <polygon points="200,300 230,218 156,262 244,262 170,218" fill="#FFFFFF"/>
      </svg>
    </div>
    <h1>🌴 Recetarios de Aquí 🌺</h1>
    <p class="subtitle" id="site-subtitle">Recetario de Cocina Puertorriqueña</p>
    <p class="author" id="site-author">Inspirado en la obra de Berta Cabanillas — Edición 1983</p>
    <!-- Coquí decorativo -->
    <div class="banner-coqui" aria-label="Coquí">
      <svg viewBox="0 0 100 100" width="60" height="60">
        <text x="50" y="65" text-anchor="middle" font-size="55">🐸</text>
      </svg>
      <span class="coqui-label">Coquí!</span>
    </div>
    <!-- Chef decorativo al lado derecho -->
    <div class="banner-chef-right" aria-label="Chef">
      <svg viewBox="0 0 100 100" width="70" height="70" class="chef-svg">
        <!-- Gorro de chef -->
        <ellipse cx="50" cy="22" rx="28" ry="18" fill="#FFFFFF"/>
        <ellipse cx="35" cy="18" rx="12" ry="14" fill="#FFFFFF"/>
        <ellipse cx="65" cy="18" rx="12" ry="14" fill="#FFFFFF"/>
        <ellipse cx="50" cy="14" rx="14" ry="12" fill="#FFFFFF"/>
        <rect x="30" y="22" width="40" height="12" fill="#FFFFFF"/>
        <!-- Banda del gorro -->
        <rect x="30" y="32" width="40" height="3" fill="#E0D5C0" rx="1"/>
        <!-- Cara -->
        <ellipse cx="50" cy="48" rx="18" ry="16" fill="#F5C49C"/>
        <!-- Ojos -->
        <ellipse cx="43" cy="45" rx="2.5" ry="3" fill="#3E2723"/>
        <ellipse cx="57" cy="45" rx="2.5" ry="3" fill="#3E2723"/>
        <!-- Brillos en los ojos -->
        <circle cx="44" cy="44" r="0.8" fill="#FFFFFF"/>
        <circle cx="58" cy="44" r="0.8" fill="#FFFFFF"/>
        <!-- Cejas -->
        <path d="M39 41 Q43 38 47 41" stroke="#5D4037" stroke-width="1.2" fill="none"/>
        <path d="M53 41 Q57 38 61 41" stroke="#5D4037" stroke-width="1.2" fill="none"/>
        <!-- Nariz -->
        <ellipse cx="50" cy="49" rx="2" ry="1.5" fill="#E8A97E"/>
        <!-- Sonrisa -->
        <path d="M43 54 Q50 60 57 54" stroke="#C0392B" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <!-- Bigote -->
        <path d="M42 52 Q46 50 50 52 Q54 50 58 52" stroke="#5D4037" stroke-width="1.5" fill="none"/>
        <!-- Cuello -->
        <rect x="44" y="62" width="12" height="6" fill="#F5C49C"/>
        <!-- Pañuelo del cuello -->
        <polygon points="38,68 50,78 62,68" fill="#E84D4D"/>
        <polygon points="44,68 50,74 56,68" fill="#C0392B"/>
        <!-- Cuerpo / chaqueta de chef -->
        <rect x="32" y="68" width="36" height="30" rx="4" fill="#FFFFFF"/>
        <!-- Botones de la chaqueta -->
        <circle cx="50" cy="76" r="1.8" fill="#333"/>
        <circle cx="50" cy="83" r="1.8" fill="#333"/>
        <circle cx="50" cy="90" r="1.8" fill="#333"/>
        <!-- Línea central de la chaqueta -->
        <line x1="50" y1="68" x2="50" y2="98" stroke="#E0D5C0" stroke-width="0.5"/>
        <!-- Brazos -->
        <rect x="20" y="72" width="14" height="8" rx="4" fill="#FFFFFF"/>
        <rect x="66" y="72" width="14" height="8" rx="4" fill="#FFFFFF"/>
        <!-- Manos -->
        <circle cx="18" cy="76" r="4" fill="#F5C49C"/>
        <circle cx="82" cy="76" r="4" fill="#F5C49C"/>
        <!-- Cuchara en mano derecha -->
        <line x1="82" y1="72" x2="88" y2="58" stroke="#999" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="89" cy="55" rx="4" ry="6" fill="#BBB" transform="rotate(-15 89 55)"/>
      </svg>
      <span class="chef-label">¡Buen Provecho!</span>
    </div>
  </header>
  <div class="decorative-border"></div>

  <!-- Category Navigation -->
  <nav class="category-nav">
    <div class="nav-pills" id="nav-pills"></div>
  </nav>

  <!-- Search -->
  <div class="search-container">
    <input type="text" class="search-box" id="search-input" placeholder="Buscar recetas...">
  </div>

  <!-- Recipe Categories -->
  <main id="categories-container"></main>

  <!-- Recipe Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <span class="modal-category-badge" id="modal-badge"></span>
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-meta">
        <span id="modal-time"></span>
        <span id="modal-servings"></span>
      </div>
      <h3 class="modal-section-title" id="modal-ingredients-title"></h3>
      <ul class="modal-ingredients" id="modal-ingredients-list"></ul>
      <h3 class="modal-section-title" id="modal-steps-title"></h3>
      <ol class="modal-steps" id="modal-steps-list"></ol>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-decorative">🌺 🌴 🍍 🌴 🌺</div>
    <p id="footer-text">Inspirado en el legado culinario de Berta Cabanillas y la cocina tradicional puertorriqueña.</p>
  </footer>

  <script src="js/recipes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
